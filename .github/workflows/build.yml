name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dusk-apk
          path: app/build/outputs/apk/release/app-release.apk
